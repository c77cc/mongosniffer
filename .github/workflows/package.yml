name: Package

on:
  workflow_call:
    inputs:
      version:
        required: false
        type: string
        default: ""
      retention-days:
        required: true
        type: number

permissions:
  contents: read

jobs:
  resolve-version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION}"
          if [[ -z "${version}" ]]; then version="snapshot-${GITHUB_SHA::7}"; fi
          echo "value=${version}" >> "${GITHUB_OUTPUT}"

  build:
    needs: resolve-version
    name: build (${{ matrix.asset }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { asset: linux_amd64, runner: ubuntu-24.04, goos: linux, goarch: amd64 }
          - { asset: linux_arm64, runner: ubuntu-24.04-arm, goos: linux, goarch: arm64 }
          - { asset: darwin_amd64, runner: macos-15-intel, goos: darwin, goarch: amd64 }
          - { asset: darwin_arm64, runner: macos-15, goos: darwin, goarch: arm64 }
          - { asset: windows_amd64, runner: windows-2025, goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
          cache: true
      - name: Test
        run: go test ./...
      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          package="mongosniffer_${VERSION}_${{ matrix.asset }}"
          mkdir -p "dist/${package}"
          if [[ "${{ matrix.goos }}" == linux ]]; then export CGO_ENABLED=0; else export CGO_ENABLED=1; fi
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath \
            -ldflags "-s -w -X main.releaseVersion=${VERSION}" \
            -o "dist/${package}/mongosniffer" ./cmd/mongosniffer
          "dist/${package}/mongosniffer" --help >/dev/null
          "dist/${package}/mongosniffer" --version | grep -F "mongosniffer ${VERSION}"
          cp README.md README_CN.md LICENSE NOTICE "dist/${package}/"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          (cd dist && shasum -a 256 "${package}.tar.gz" > "${package}.tar.gz.sha256")
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          $package = "mongosniffer_${env:VERSION}_${{ matrix.asset }}"
          New-Item -ItemType Directory -Force -Path "dist/$package" | Out-Null
          $env:CGO_ENABLED = "0"
          go build -trimpath -ldflags "-s -w -X main.releaseVersion=$env:VERSION" -o "dist/$package/mongosniffer.exe" ./cmd/mongosniffer
          & "dist/$package/mongosniffer.exe" --help | Out-Null
          $actual = & "dist/$package/mongosniffer.exe" --version
          if (-not $actual.StartsWith("mongosniffer $env:VERSION")) { throw "unexpected version: $actual" }
          Copy-Item README.md, README_CN.md, LICENSE, NOTICE -Destination "dist/$package"
          Compress-Archive -Path "dist/$package/*" -DestinationPath "dist/$package.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$package.zip").Hash.ToLowerInvariant()
          "$hash  $package.zip" | Set-Content -Encoding ascii "dist/$package.zip.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.asset }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
